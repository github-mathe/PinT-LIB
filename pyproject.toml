[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batpint"
version = "0.0.1"
description = "Battery modeling using Parallel-in-Time methods"
dependencies = [
    "pybamm",
    "numpy",
    "matplotlib",
    "jupyter",
    "notebook",
    "ipywidgets"
]
requires-python = ">=3.10"
maintainers = [
    {name = "Aigerim Yessim", email = "yessima@hsu-hh.de"},
    {name = "Thibaut Lunet", email = "thibaut.lunet@tuhh.de"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/github-mathe/PinT-LIB"
Tracker = "https://github.com/github-mathe/PinT-LIB/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --timeout=300"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E701"]  # line length handled by formatter; lambdas and compact one-liners are idiomatic in this codebase

[tool.ruff.lint.isort]
known-first-party = ["batpint"]